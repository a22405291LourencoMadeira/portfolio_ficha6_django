{% extends "portfolio/base.html" %}
{% block content %}
<h2>Bem-vindo ao meu Portfólio</h2>
{% if licenciatura %}
<article>
    <header>
        <h3>{{ licenciatura.nome }}</h3>
        <p>{{ licenciatura.sigla }} — {{ licenciatura.duracao_anos }} anos</p>
    </header>
    <section>
        <p>{{ licenciatura.descricao }}</p>
    </section>
</article>
{% endif %}
{% endblock %}
