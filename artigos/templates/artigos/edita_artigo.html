{% extends "portfolio/base.html" %}
{% block content %}
<h2>Editar Artigo: {{ artigo.titulo }}</h2>
<form method="post" action="{% url 'edita_artigo' artigo.id %}" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Guardar">
</form>
{% endblock %}
