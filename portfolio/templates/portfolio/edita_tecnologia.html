{% extends "portfolio/base.html" %}
{% block content %}
<h2>Editar Tecnologia: {{ tec.nome }}</h2>
<form action="{% url 'edita_tecnologia' tec.id %}" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Guardar">
</form>
{% endblock %}
