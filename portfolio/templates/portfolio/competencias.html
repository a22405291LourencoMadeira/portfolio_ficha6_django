{% extends "portfolio/base.html" %}
{% block content %}
<h2>Competências</h2>
<a href="{% url 'nova_competencia' %}"><button>+ Nova Competência</button></a>
<section>
    {% for comp in competencias %}
    <article>
        <header>
            <h3>{{ comp.nome }}</h3>
            <p>Nível: {{ comp.nivel }}</p>
        </header>
        <section>
            <h4>Tecnologias</h4>
            <ul>
                {% for tec in comp.tecnologias.all %}
                    <li>{{ tec.nome }}</li>
                {% endfor %}
            </ul>
        </section>
        <a href="{% url 'edita_competencia' comp.id %}"><button>Editar</button></a>
        <a href="{% url 'apaga_competencia' comp.id %}"><button>Apagar</button></a>
    </article>
    {% endfor %}
</section>
{% endblock %}
