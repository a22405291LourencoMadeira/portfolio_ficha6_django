{% extends "portfolio/base.html" %}
{% block content %}
<h2>Editar Projeto: {{ projeto.nome }}</h2>
<form action="{% url 'edita_projeto' projeto.id %}" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Guardar">
</form>
{% endblock %}
